:#21190f}.magic{color:var(--blue)}.rare{color:var(--rare)}.uniq{color:var(--uniq);font-weight:600}.pill{border:1px solid var(--line);color:var(--dim);white-space:nowrap;border-radius:99px;margin:1px 2px 1px 0;padding:0 7px;font-size:12px;display:inline-block}input[type=search]{border:1px solid var(--line);width:100%;max-width:360px;color:var(--ink);font:inherit;background:#0b0805;border-radius:6px;padding:7px 10px}button.b{cursor:pointer;color:#1c1610;background:var(--gold);border:0;border-radius:5px;padding:5px 11px;font:13px system-ui}button.b.ghost{color:var(--ink);border:1px solid var(--line);background:0 0}.tree{grid-template-columns:1fr 300px;gap:12px;display:grid}@media (max-width:860px){.tree{grid-template-columns:1fr}}.tree canvas{border:1px solid var(--line);touch-action:none;background:#07060a;border-radius:8px;width:100%;display:block}.side{flex-direction:column;gap:10px;display:flex}.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.box b.t{color:var(--gold2)}.tools{flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;display:flex}.hits{flex-wrap:wrap;gap:4px;max-height:120px;margin-top:6px;display:flex;overflow:auto}.hits button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:#21190f;border-radius:99px;padding:2px 8px;font:12px system-ui}.legend span{color:var(--dim);align-items:center;gap:4px;margin-right:10px;font-size:12px;display:inline-flex}.legend i{border-radius:50%;width:10px;height:10px;display:inline-block}.ok{color:#9ae08a;font-weight:600}</style>
