    <style>:root{--bg:#0d0a07;--panel:#18120c;--line:#4a3a22;--gold:#e8c060;--gold2:#ffd27a;--ink:#f3e6c8;--dim:#b4a585;--blue:#8fa8ff;--rare:#ffe36a;--uniq:#d9a441;--cyan:#7ad0ff;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:15px/1.55 Noto Sans Thai,system-ui,sans-serif}header{border-bottom:1px solid var(--line);background:var(--panel);z-index:5;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;display:flex;position:sticky;top:0}header h1{color:var(--gold2);letter-spacing:1px;margin:0;font-size:20px}header .season{color:var(--dim);font-size:13px}header .sp{flex:1}header a{color:var(--gold2);font-size:14px}.langsw button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:0 0;border-radius:6px;padding:2px 10px;font:13px system-ui}.langsw button.on{background:var(--gold);color:#1c1610;border-color:var(--gold)}nav{border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;gap:4px;padding:8px 16px;display:flex;overflow-x:auto}nav a{white-space:nowrap;color:var(--ink);border-radius:6px;padding:6px 12px;font-size:14px;text-decoration:none}nav a.on{background:var(--gold);color:#1c1610;font-weight:600}main{max-width:1180px;margin:0 auto;padding:16px}h2{color:var(--gold2);margin:4px 0 10px;font-size:21px}h3{color:var(--gold);margin:18px 0 6px;font-size:16px}p{margin:6px 0}.dim{color:var(--dim);font-size:13px}.scroll{-webkit-overflow-scrolling:touch;border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:8px 0 14px;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}@media (max-width:760px){.scroll table{min-width:720px}}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #2c2216;padding:6px 9px}th{color:var(--dim);white-space:nowrap;background:var(--panel);font-weight:600;position:sticky;top:0}td.n{white-space:nowrap;font-variant-numeric:tabular-nums}tr:hover td{background:#21190f}.magic{color:var(--blue)}.rare{color:var(--rare)}.uniq{color:var(--uniq);font-weight:600}.pill{border:1px solid var(--line);color:var(--dim);white-space:nowrap;border-radius:99px;margin:1px 2px 1px 0;padding:0 7px;font-size:12px;display:inline-block}input[type=search]{border:1px solid var(--line);width:100%;max-width:360px;color:var(--ink);font:inherit;background:#0b0805;border-radius:6px;padding:7px 10px}button.b{cursor:pointer;color:#1c1610;background:var(--gold);border:0;border-radius:5px;padding:5px 11px;font:13px system-ui}button.b.ghost{color:var(--ink);border:1px solid var(--line);background:0 0}.tree{grid-template-columns:1fr 300px;gap:12px;display:grid}@media (max-width:860px){.tree{grid-template-columns:1fr}}.tree canvas{border:1px solid var(--line);touch-action:none;background:#07060a;border-radius:8px;width:100%;display:block}.side{flex-direction:column;gap:10px;display:flex}.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.box b.t{color:var(--gold2)}.tools{flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;display:flex}.hits{flex-wrap:wrap;gap:4px;max-height:120px;margin-top:6px;display:flex;overflow:auto}.hits button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:#21190f;border-radius:99px;padding:2px 8px;font:12px system-ui}.legend span{color:var(--dim);align-items:center;gap:4px;margin-right:10px;font-size:12px;display:inline-flex}.legend i{border-radius:50%;width:10px;height:10px;display:inline-block}.ok{color:#9ae08a;font-weight:600}.ico{image-rendering:pixelated;vertical-align:middle;flex:none;display:inline-block}.nm{align-items:center;gap:8px;display:inline-flex}img.px{image-rendering:pixelated}img.px.sm{object-fit:contain;width:40px;height:40px}.mons{flex-wrap:wrap;gap:10px;margin:8px 0 14px;display:flex}.mon{background:var(--panel);border:1px solid var(--line);text-align:center;border-radius:10px;justify-items:center;gap:2px;width:128px;padding:8px;font-size:13px;display:grid}.mon img{object-fit:contain;width:96px;height:96px}.figs{flex-wrap:wrap;gap:12px;margin:8px 0 12px;display:flex}figure{flex:260px;max-width:520px;margin:0}figure img{border:1px solid var(--line);background:#0b0805;border-radius:8px;width:100%;display:block}figure img.hero,figure img.boss{object-fit:contain;width:140px;height:140px}:is(figure:has(img.hero),figure:has(img.boss)){flex:none}figcaption{color:var(--dim);margin-top:4px;font-size:13px}.toc{flex-wrap:wrap;gap:6px;margin:10px 0 16px;display:flex}.toc button{cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font:13px Noto Sans Thai,system-ui}.toc button:hover{border-color:var(--gold)}.guide section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:14px 18px;scroll-margin-top:72px}.guide ul{margin:6px 0;padding-left:22px}.guide li{margin:3px 0}.guide .scroll{background:var(--bg)}.guide .note{color:var(--dim);font-size:14px}.guide .warn{border-left:3px solid var(--gold);color:var(--dim);margin:10px 0;padding:4px 10px;font-size:14px}.guide .more a{color:var(--cyan);font-weight:600}.guide .grey{color:#9a958a;font-weight:600}.guide .red{color:#e0503a;font-weight:600}kbd{border:1px solid var(--line);background:var(--bg);text-align:center;border-bottom-width:3px;border-radius:5px;min-width:22px;padding:1px 7px;font:13px ui-monospace,monospace;display:inline-block}code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:14px ui-monospace,monospace}</style>

  </head>
  <body>
    <header>
      <h1>RPOEE Wiki</h1>
      <span class="season"></span>
      <span class="sp"></span>
      <a href="../">Tester page</a><a href="../play/">▶ Play</a>
      <span class="langsw"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></span>
    </header>
    <nav></nav>
    <main id="page"></main>
    <script>
      // ภาษาของ Wiki: ลิงก์ ?lang= > ที่ผู้อ่านเคยกดเลือกใน Wiki > ภาษาเบราว์เซอร์ (ไทย = ไทย, อื่น ๆ = อังกฤษ)
      (function () {
        var u = new URL(location.href);
        if (u.searchParams.get("lang")) return;
        var l = null;
        try { l = localStorage.getItem("wiki-lang"); } catch (e) {}
        if (l !== "th" && l !== "en") l = (navigator.languages || [navigator.language || ""]).some(function (x) { return /^th\b/i.test(x); }) ? "th" : "en";
        u.searchParams.set("lang", l);
        history.replaceState(null, "", u.toString());
      })();
    </script>
  </body>
