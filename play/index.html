    <title>RPOEE — Phaser Prototype</title>
    <style>html,body,#game{background:#0e0c0a;height:100%;margin:0;overflow:hidden}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#equip b{cursor:pointer}#equip.min label,#equip.min small{display:none}#equip.min{min-width:0}#optbtn{z-index:3;cursor:pointer;background:#280a3cb3;border:2px dashed #b07ae0;border-radius:50%;width:36px;height:36px;padding:0;font-size:18px;line-height:1;position:fixed;top:8px;right:96px}#opts{z-index:3;color:#f3e6c8;background:#000c;border:1px solid #8a6a38;border-radius:6px;gap:6px;min-width:150px;padding:8px 10px;font:13px system-ui,sans-serif;display:grid;position:fixed;top:50px;right:96px;border-style:dashed!important;border-color:#b07ae0!important}#opts[hidden]{display:none}#opts label{justify-content:space-between;align-items:center;gap:10px;display:flex}#opts select{font:14px system-ui,sans-serif}#touchpad{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;pointer-events:none;width:240px;height:190px;position:fixed}#touchpad .tb{pointer-events:auto;color:#fff;touch-action:none;background:#14100a8c;border:2px solid #ffe6aa8c;border-radius:50%;padding:0;font-size:24px;position:absolute;overflow:hidden}#touchpad .tb:active{background:#785a28b3}#touchpad .tb span{z-index:1;position:relative}#touchpad .tb i{background:#0009;height:0;position:absolute;bottom:0;left:0;right:0}#touchpad .tb.cool span{opacity:.5}#touchpad .atk{width:92px;height:92px;font-size:38px;bottom:0;right:0}#touchpad .sk{width:62px;height:62px;bottom:6px;right:100px}#touchpad .ds{width:62px;height:62px;bottom:76px;right:92px}#touchpad .bs{width:58px;height:58px;bottom:44px;right:168px}#touchpad .tk{background:#3c3010bf;width:62px;height:62px;bottom:102px;right:14px}#touchpad .tk[hidden],#touchpad.peace .atk,#touchpad.peace .sk,#touchpad.peace .ds,#touchpad.peace .bs{display:none}body.touch #equip{inset:64px auto auto 8px}body.touch #info{font-size:11px}#joyzone{z-index:2;touch-action:none;width:45vw;position:fixed;top:70px;bottom:0;left:0}#joy{left:calc(90px + env(safe-area-inset-left));top:calc(100% - 90px - env(safe-area-inset-bottom));opacity:.55;pointer-events:none;background:#14100a4d;border:2px solid #ffe6aa59;border-radius:50%;width:120px;height:120px;margin:-60px 0 0 -60px;position:absolute}#joy.on{opacity:1}#joy .knob{background:#ffecbebf;border-radius:50%;width:52px;height:52px;margin:-26px 0 0 -26px;position:absolute;top:50%;left:50%;box-shadow:0 2px 6px #0008}#rotate{z-index:9;color:#f3e6c8;text-align:center;background:#0e0c0a;place-content:center;justify-items:center;gap:12px;padding:24px;font:600 16px system-ui,sans-serif;display:grid;position:fixed;inset:0}#rotate[hidden]{display:none}#rotate .ph{font-size:56px;animation:1.8s ease-in-out infinite rot}@keyframes rot{0%,30%{transform:rotate(0)}60%,to{transform:rotate(-90deg)}}@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}@media (max-height:430px){#touchpad{transform-origin:100% 100%;transform:scale(.85)}}#equip{color:#f3e6c8;z-index:2;background:#000000a6;gap:4px;min-width:190px;padding:6px 8px;font:12px system-ui,sans-serif;display:grid;position:fixed;top:52px;right:8px}#equip label{justify-content:space-between;align-items:center;gap:8px;display:flex}#equip select{max-width:120px;font:12px system-ui,sans-serif}#bossbar{z-index:2;color:#f3e6c8;text-align:center;text-shadow:0 1px 2px #000;width:min(520px,80vw);font:12px system-ui,sans-serif;display:none;position:fixed;top:84px;left:50%;transform:translate(-50%)}#bossbar .name{letter-spacing:1px;margin-bottom:3px;font-weight:700}#bossbar .track{background:#1a0c08;border:1px solid #8a6a38;height:10px}#bossbar .fill{background:linear-gradient(#e0503a,#9a1e14);width:100%;height:100%;transition:width .15s}#bossbar .hp{margin-top:2px;font-size:11px}#bossbar .cast{width:min(300px,70%);margin:4px auto 0;display:none}#bossbar .cast span{color:#ffe8b0;letter-spacing:.5px;font-size:12px;font-weight:700;display:block}#bossbar .cast .ct{background:#0a0806cc;border:1px solid #8a6a38;border-radius:3px;height:6px;margin-top:2px;overflow:hidden}#bossbar .cast .cf{width:0;height:100%;box-shadow:0 0 8px}#vignette{pointer-events:none;z-index:1;background:radial-gradient(#0000 55%,#080e068c 100%);position:fixed;inset:0}#toast{z-index:3;white-space:nowrap;color:#e0503a;text-shadow:0 2px 6px #000,0 0 2px #000;letter-spacing:2px;font:700 clamp(18px,5vw,34px) system-ui,sans-serif;display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%)}#info{color:#f3e6c8;z-index:2;background:#0009;padding:4px 8px;font:12px monospace;position:fixed;top:8px;left:8px}</style>
