ne-flex}.dot{background:var(--green);width:9px;height:9px;box-shadow:0 0 8px var(--green);border-radius:50%;animation:1.6s ease-in-out infinite pulse}@keyframes pulse{50%{opacity:.35}}.play{color:#1c1610;background:linear-gradient(#ffd27a,#c9973f);border-radius:8px;padding:9px 22px;font-weight:700;text-decoration:none;display:inline-block;box-shadow:0 4px 14px #0008}.play:hover{filter:brightness(1.08)}.me{text-align:center;background:var(--me);border:1px solid #6fb04a;border-radius:10px;max-width:520px;margin:14px auto 0;padding:10px 14px}.me b{color:#c8ff9a;font-size:18px}.podium{grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:22px 0 18px;display:grid}.pd{text-align:center;border:1px solid var(--line);background:linear-gradient(#2a1f12,#15100a);border-radius:14px 14px 8px 8px;min-width:0;padding:14px 8px 12px;position:relative}.pd .md{font-size:34px;line-height:1}.pd .nm{overflow-wrap:anywhere;margin-top:6px;font-size:17px;font-weight:700}.pd .lv{color:var(--gold2);font:700 26px Georgia,serif}.pd .xp{color:var(--dim);font-size:12px}.pd .ach{min-height:22px;margin-top:6px}.pd.p1{border-color:#e8c060;padding-top:22px;box-shadow:0 0 26px #e8c06044}.pd.p1 .md{font-size:44px}.pd.p2{border-color:#b8c4d0}.pd.p3{border-color:#c98a4a}.pd.you,tr.you td{outline-offset:-2px;outline:2px solid #9be06a}.ico{cursor:default;margin:0 1px;font-size:15px;display:inline-block}.tools{align-items:center;gap:8px;margin:4px 0 8px;display:flex}.tools input{border:1px solid var(--line);max-width:320px;color:var(--ink);font:inherit;background:#0b0805;border-radius:6px;flex:1;padding:7px 10px}.tbl{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #2c2216;padding:8px 10px}th{color:var(--dim);background:var(--panel2);font-size:13px;font-weight:600}td.n{font-variant-numeric:tabular-nums;white-space:nowrap}td.rk{text-align:center;width:44px;color:var(--dim);font-weight:700}tr:last-child td{border-bottom:0}tr.you td{background:var(--me)}.xpbar{background:#2c2216;border-radius:2px;max-width:120px;height:4px;margin-top:3px}.xpbar i{background:linear-gradient(90deg,#c9973f,#ffd27a);border-radius:2px;height:100%;display:block}.dim{color:var(--dim);font-size:13px}.legend{flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 4px;display:flex}.legend .pill{font-size:13px}footer{text-align:center;color:var(--dim);margin-top:18px;font-size:13px}@media (max-width:560px){.podium{gap:6px}.pd{padding:10px 4px 8px}.pd .nm{font-size:14px}.pd .lv{font-size:21px}.pd .md{font-size:28px}.pd.p1 .md{font-size:34px}th.ach,td.ach{display:none}th,td{padding:7px 6px}header nav{display:none}}</style>

  <body>
    <header>
      <a class="logo" href="../">RPOEE</a>
      <span class="sp"></span>
      <nav><a data-k="wiki" href="../wiki/">Wiki</a></nav>
      <span class="langsw"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></span>
    </header>
    <main id="page"></main>
    <script>
      // ภาษา: ?lang= > ที่เคยเลือกใน Wiki > ภาษาเบราว์เซอร์
      (function () {
        var u = new URL(location.href);
        if (u.searchParams.get("lang")) return;
        var l = null;
        try { l = localStorage.getItem("wiki-lang"); } catch (e) {}
        if (l !== "th" && l !== "en") l = (navigator.languages || [navigator.language || ""]).some(function (x) { return /^th\b/i.test(x); }) ? "th" : "en";
        u.searchParams.set("lang", l);
        history.replaceState(null, "", u.toString());
      })();
    </script>
