# กัน Supabase (แพ็กเกจฟรี) หลับ: ไม่มีคนใช้ 1 สัปดาห์ โปรเจกต์จะถูกพัก
# เรียก REST API วันละครั้ง (query ตาราง characters ด้วย anon key — RLS ให้ผลว่าง แต่นับเป็นการใช้งาน)
# ล้ม = GitHub ส่งอีเมลแจ้งเจ้าของ repo
name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 * * *" # ทุกวัน 10:17 น. เวลาไทย
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/characters?select=id&limit=1")
          echo "status $code"
          test "$code" = "200"
