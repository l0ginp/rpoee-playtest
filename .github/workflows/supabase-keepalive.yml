# กัน Supabase (แพ็กเกจฟรี) หลับ: ไม่มีคนใช้ 1 สัปดาห์ โปรเจกต์จะถูกพัก
# เรียก Supabase วันละครั้งด้วยคีย์ publishable (ส่งใน header apikey เท่านั้น — ใส่ Authorization: Bearer จะได้ 401)
# ล้ม = GitHub ส่งอีเมลแจ้งเจ้าของ repo
name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 * * *" # ทุกวัน 10:17 น. เวลาไทย
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1) ฟังก์ชัน keepalive ในฐานข้อมูล (query จริง) · 2) ยังไม่ได้ลง migration = ถอยไปเรียก Auth settings
          rpc=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "rpc keepalive: $rpc"
          if [ "$rpc" = "200" ]; then exit 0; fi
          auth=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/settings")
          echo "auth settings: $auth (fallback — apply supabase/migrations/20261012000000_keepalive.sql for a real DB query)"
          test "$auth" = "200"
